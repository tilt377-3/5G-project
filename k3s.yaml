---
apiVersion: v1
kind: Namespace
metadata:
  name: udp-echo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo-server
  namespace: udp-echo
  labels:
    app: udp-echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-echo-server
  template:
    metadata:
      labels:
        app: udp-echo-server
    spec:
      containers:
      - name: server
        image: udp-echo-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: UDP
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: udp-echo-server
  namespace: udp-echo
  labels:
    app: udp-echo-server
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: udp-echo-server
  ports:
  - port: 8080
    targetPort: 8080
    protocol: UDP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: udp-echo-client
  namespace: udp-echo
  labels:
    app: udp-echo-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: udp-echo-client
  template:
    metadata:
      labels:
        app: udp-echo-client
    spec:
      containers:
      - name: client
        image: udp-echo-client:latest
        imagePullPolicy: IfNotPresent
        stdin: true
        tty: true
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
